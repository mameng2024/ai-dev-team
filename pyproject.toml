[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-dev-team"
version = "0.6.0"
description = "A lightweight multi-agent software development orchestrator"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "langgraph>=0.2,<2",
  "litellm>=1.40,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2", "ruff>=0.5"]

[project.scripts]
ai-dev-team = "ai_dev_team.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_dev_team"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/ai_dev_team/cli.py" = ["B008"]  # typer.Option defaults are the documented Typer idiom
