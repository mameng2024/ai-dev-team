<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Dev Team</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1d1d1f; --mute:#6e6e73; --line:#e3e3e0; --accent:#2f5bea; --red:#c62828; --green:#1f8a4c; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; background:var(--bg); color:var(--ink);
         display:flex; flex-direction:column; }
  .top { display:flex; align-items:center; gap:18px; padding:10px 20px; border-bottom:1px solid var(--line); background:#fbfbfa; }
  .top h1 { font-size:16px; margin:0; }
  .tabs { display:flex; gap:4px; }
  .tabs button { border:0; background:transparent; padding:6px 14px; border-radius:8px; font:inherit; color:var(--mute); cursor:pointer; }
  .tabs button.on { background:#eceae6; color:var(--ink); font-weight:600; }
  .spacer { flex:1; }
  .pill { font-size:12px; padding:3px 10px; border-radius:99px; background:#eaf7ef; color:var(--green); cursor:pointer; }
  .pill.warn { background:#fdeeee; color:var(--red); }
  button.btn { font:inherit; border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; white-space:nowrap; }
  button.btn:hover { border-color:#c9c9c4; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--red); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .view { flex:1; min-height:0; display:none; }
  .view.on { display:flex; }
  iframe { border:0; width:100%; height:100%; background:var(--bg); }
  #runView { gap:16px; padding:16px 20px; overflow:hidden; }
  .col { display:flex; flex-direction:column; gap:12px; min-height:0; }
  .left { width:300px; flex:none; overflow:auto; }
  .mid { flex:1; overflow:auto; min-width:0; }
  .right { width:44%; flex:none; min-width:360px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card h3 { font-size:13px; margin:0 0 10px; color:var(--mute); font-weight:600; }
  .proj { padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  .proj.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .proj b { display:block; } .proj .path { font-size:11px; color:var(--mute); word-break:break-all; }
  .mini { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; font-size:11px; }
  .mini span { background:#f0f0ee; border-radius:6px; padding:1px 6px; }
  label { display:block; font-size:12px; color:var(--mute); margin:8px 0 3px; }
  input, textarea, select { width:100%; font:inherit; border:1px solid var(--line); border-radius:8px; padding:7px 9px; background:#fff; }
  textarea { min-height:110px; resize:vertical; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row input { flex:1; }
  .hint { font-size:12px; color:var(--mute); margin-top:6px; }
  .steps { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .step { border:1px solid var(--line); border-radius:10px; padding:10px; background:#fafaf8; }
  .step b { display:block; font-size:13px; } .step p { margin:4px 0 8px; font-size:12px; color:var(--mute); }
  .jobs { display:flex; flex-direction:column; gap:6px; max-height:180px; overflow:auto; }
  .job { display:flex; gap:8px; align-items:center; padding:6px 8px; border-radius:8px; cursor:pointer; font-size:13px; }
  .job.on { background:#eef1fd; }
  .dot { width:8px; height:8px; border-radius:50%; flex:none; background:#bbb; }
  .dot.running { background:#f2a100; animation:pulse 1s infinite; } .dot.succeeded { background:var(--green); }
  .dot.failed { background:var(--red); } .dot.stopped { background:#999; }
  @keyframes pulse { 50% { opacity:.3; } }
  pre { margin:0; flex:1; min-height:0; overflow:auto; background:#16171a; color:#e8e8e3; border-radius:10px; padding:12px;
        font:12px/1.5 ui-monospace,Menlo,monospace; white-space:pre-wrap; word-break:break-word; }
  .logcard { flex:1; display:flex; flex-direction:column; min-height:0; }
  .loghead { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .problems li { color:var(--red); font-size:13px; }
  .commits { font:12px/1.6 ui-monospace,Menlo,monospace; color:var(--mute); max-height:120px; overflow:auto; }
  .copy { font:12px ui-monospace,Menlo,monospace; background:#f3f3f1; border-radius:8px; padding:8px; word-break:break-all; }
  .empty { color:var(--mute); font-size:13px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1d1d1f; color:#fff; padding:10px 16px; border-radius:10px; display:none; z-index:9; max-width:70%; }
  .bye { margin:auto; text-align:center; color:var(--mute); }
</style>
</head>
<body>
<div class="top">
  <h1>AI Dev Team</h1>
  <div class="tabs">
    <button data-tab="run" class="on">项目与运行</button>
    <button data-tab="board">看板</button>
    <button data-tab="settings">模型设置</button>
  </div>
  <span class="spacer"></span>
  <span class="pill" id="ready">检查中…</span>
  <button class="btn" id="quit">退出</button>
</div>

<div class="view on" id="runView">
  <div class="col left">
    <div class="card">
      <h3>项目</h3>
      <div id="projects" class="col" style="gap:8px"></div>
    </div>
    <div class="card">
      <h3>添加项目</h3>
      <label>Git 仓库路径</label>
      <div class="row"><input id="npath" placeholder="/Users/你/code/MiniTot"><button class="btn" id="pick" title="选择文件夹">选择…</button></div>
      <label>项目 ID（英文，例如 minitot）</label>
      <input id="nid" placeholder="minitot">
      <label>主分支</label>
      <input id="nbranch" value="main">
      <div class="row" style="margin-top:10px"><button class="btn primary" id="add">添加</button></div>
      <div class="hint">只登记路径，不改仓库里的任何东西。</div>
    </div>
  </div>

  <div class="col mid" id="detail"></div>

  <div class="col right">
    <div class="card">
      <h3>操作记录</h3>
      <div class="jobs" id="jobs"></div>
    </div>
    <div class="card logcard">
      <div class="loghead"><b id="logTitle">日志</b><span class="spacer"></span><button class="btn danger" id="stop" disabled>停止</button></div>
      <pre id="log">选择一条操作记录查看输出。</pre>
    </div>
  </div>
</div>

<div class="view" id="boardView"><iframe id="boardFrame" title="看板"></iframe></div>
<div class="view" id="settingsView"><iframe id="settingsFrame" title="模型设置"></iframe></div>
<div class="toast" id="toast"></div>

<script>
const TOKEN = new URLSearchParams(location.search).get("token");
const H = {"X-Token": TOKEN, "Content-Type": "application/json"};
const $ = id => document.getElementById(id);
const STATUS = {READY:"就绪",PENDING:"等待依赖",ASSIGNED:"已分配",RUNNING:"开发中",TESTING:"测试中",REVIEWING:"审核中",
  REWORK:"返工",MERGE_QUEUED:"待合并",MERGED:"已合并",COMPLETED:"完成",BLOCKED:"阻塞",FAILED:"失败"};
const JOBST = {running:"进行中",succeeded:"完成",failed:"失败",stopped:"已停止"};
const finishedSeen = new Set();
let ov = {projects:[], problems:[]}, current = localStorage.getItem("aidt.project") || "", jobId = null, since = 0, jobsCache = [];

function el(tag, attrs={}, ...kids){ const e=document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) { if(k==="class") e.className=v; else if(k.startsWith("on")) e[k]=v; else if(v!=null) e.setAttribute(k,v); }
  for (const k of kids.flat()) e.append(k?.nodeType ? k : document.createTextNode(k ?? "")); return e; }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",4000); }
async function api(path, body){
  const r = await fetch(path, body===undefined ? {headers:H} : {method:"POST", headers:H, body:JSON.stringify(body)});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(d.error || ("HTTP "+r.status)), {status:r.status, data:d});
  return d;
}

// ---------- tabs
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
function showTab(tab){
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on", x.dataset.tab===tab));
  $("runView").classList.toggle("on", tab==="run");
  $("boardView").classList.toggle("on", tab==="board");
  $("settingsView").classList.toggle("on", tab==="settings");
  const q = "token="+encodeURIComponent(TOKEN)+"&embed=1";
  if(tab==="board" && !$("boardFrame").src) $("boardFrame").src = "/dashboard?"+q;
  if(tab==="settings" && !$("settingsFrame").src) $("settingsFrame").src = "/settings?"+q;
  if(tab==="run") refresh();
}

// ---------- overview
async function refresh(){
  try { ov = await api("/api/overview"); } catch(e){ return; }
  const ready = $("ready");
  if(ov.problems.length){ ready.className="pill warn"; ready.textContent=`还差 ${ov.problems.length} 项设置`; }
  else { ready.className="pill"; ready.textContent="已就绪"; }
  ready.onclick = () => showTab("settings");
  if(!ov.projects.find(p=>p.id===current)) current = ov.projects[0]?.id || "";
  renderAll();
}
let lastKey = "";
function renderAll(force){
  const key = JSON.stringify([ov, current, jobsCache.filter(j=>j.status==="running").map(j=>j.id)]);
  if(!force && key===lastKey) return;
  if(!force && document.activeElement && ["req","npath","nid","nbranch"].includes(document.activeElement.id)) return;
  lastKey = key; renderProjects(); renderDetail();
}
function renderProjects(){
  const box=$("projects"); box.innerHTML="";
  if(!ov.projects.length){ box.append(el("div",{class:"empty"},"还没有项目，先在下面添加一个。")); return; }
  for(const p of ov.projects){
    const c=p.counts||{}, done=c.COMPLETED||0;
    box.append(el("div",{class:"proj"+(p.id===current?" on":""), onclick:()=>{current=p.id; localStorage.setItem("aidt.project",p.id); $("req") && ($("req").id="req-old"); renderAll(true);}},
      el("b",{},p.name||p.id), el("div",{class:"path"},p.repo_path),
      el("div",{class:"mini"}, el("span",{},`任务 ${p.total}`), el("span",{},`完成 ${done}`),
        (c.BLOCKED? el("span",{style:"color:#c62828"},`阻塞 ${c.BLOCKED}`):""),
        p.integration?.commits?.length ? el("span",{},`待你合并 ${p.integration.commits.filter(x=>x.includes("Merge ")).length}`):"")));
  }
}
function busy(kind){ return jobsCache.some(j=>j.status==="running" && j.project===current && (!kind || j.kind===kind)); }
function renderDetail(){
  const box=$("detail");
  const keepReq = $("req")?.dataset.project===current ? $("req").value : undefined;
  box.innerHTML="";
  if(ov.problems.length){
    box.append(el("div",{class:"card"}, el("h3",{},"开始前还需要"),
      el("ul",{class:"problems"}, ov.problems.map(p=>el("li",{},p))),
      el("div",{class:"row"}, el("button",{class:"btn primary",onclick:()=>showTab("settings")},"去模型设置"),
        el("button",{class:"btn",onclick:()=>start("opencode_check")},"检查 OpenCode"),
        el("button",{class:"btn",onclick:()=>start("config_check")},"检查配置"))));
  }
  const p = ov.projects.find(x=>x.id===current);
  if(!p){ box.append(el("div",{class:"card empty"},"添加项目后，在这里写需求、规划、开始开发。")); return; }
  const running = busy();
  const c = p.counts||{};
  box.append(el("div",{class:"card"},
    el("h3",{},`${p.name||p.id} · 主分支 ${p.default_branch}`),
    p.repo_ok ? "" : el("div",{class:"problems"},el("li",{},"仓库路径不存在了，请重新添加项目")),
    el("div",{class:"mini"}, Object.entries(c).map(([k,v])=>el("span",{},`${STATUS[k]||k} ${v}`)))));

  const req = el("textarea",{id:"req",placeholder:"例如：给 MiniTot 增加夜间模式，设置页可以切换，默认跟随系统"});
  req.dataset.project = current;
  req.value = keepReq ?? (localStorage.getItem("aidt.req."+current) || "");
  req.oninput = () => localStorage.setItem("aidt.req."+current, req.value);
  box.append(el("div",{class:"card"}, el("h3",{},"① 写需求，让 Manager 和 Architect 规划"), req,
    el("div",{class:"row",style:"margin-top:10px"},
      el("button",{class:"btn",disabled:running?"":null,onclick:()=>start("plan",{project:p.id,request:req.value,save:false})},"预览规划（不保存）"),
      el("button",{class:"btn primary",disabled:running?"":null,onclick:()=>{ if(confirm("保存这次规划生成的任务？")) start("plan",{project:p.id,request:req.value,save:true}); }},"规划并保存任务")),
    el("div",{class:"hint"},"规划会调用 Manager 和 Architect 模型；预览只看结果，不写入任务。")));

  box.append(el("div",{class:"card"}, el("h3",{},"② 开发"),
    el("div",{class:"steps"},
      el("div",{class:"step"},el("b",{},"试运行"),el("p",{},"只演练调度，不改任何代码"),
        el("button",{class:"btn",disabled:running?"":null,onclick:()=>start("run",{project:p.id,mode:"dry"})},"开始")),
      el("div",{class:"step"},el("b",{},"正式开发"),el("p",{},"OpenCode 在独立 worktree 写代码，测试、审核后合并到集成分支"),
        el("button",{class:"btn primary",disabled:running?"":null,onclick:()=>{ if(confirm("开始正式开发？两个 Developer 会并行工作，main 分支不会被改动。")) start("run",{project:p.id,mode:"opencode"}); }},"开始")),
      el("div",{class:"step"},el("b",{},"合并队列"),el("p",{},"手动处理待合并的任务"),
        el("button",{class:"btn",disabled:running?"":null,onclick:()=>start("merge",{project:p.id})},"处理")),
      el("div",{class:"step"},el("b",{},"恢复"),el("p",{},"崩溃或停止后，把超时任务放回就绪"),
        el("button",{class:"btn",onclick:()=>start("recover")},"恢复"))),
    running ? el("div",{class:"hint"},"这个项目正在执行操作，结束或停止后才能开始新的。") : ""));

  const integ = p.integration;
  box.append(el("div",{class:"card"}, el("h3",{},"③ 检查集成分支，自己合并到 main"),
    integ && integ.commits.length ? [
      el("div",{class:"commits"}, integ.commits.map(x=>el("div",{},x))),
      el("label",{},"确认没问题后，在终端执行（ai-dev-team 永远不会自己合并到 main）"),
      el("div",{class:"copy"},integ.merge_cmd),
      el("div",{class:"row",style:"margin-top:8px"},el("button",{class:"btn",onclick:()=>{navigator.clipboard?.writeText(integ.merge_cmd); toast("已复制");}},"复制命令"))
    ] : el("div",{class:"empty"},"还没有完成合并的任务。")));
}

// ---------- add project
$("pick").onclick = async () => { try { const d=await api("/api/pick-folder",{}); if(d.path){ $("npath").value=d.path;
  if(!$("nid").value) $("nid").value=d.path.split("/").pop().toLowerCase().replace(/[^a-z0-9._-]+/g,"-"); } } catch(e){ toast(e.message); } };
$("add").onclick = async () => {
  const job = await start("project_add",{path:$("npath").value.trim(), id:$("nid").value.trim(), branch:$("nbranch").value.trim()||"main"});
  if(job){ current=$("nid").value.trim(); localStorage.setItem("aidt.project",current); $("npath").value=""; $("nid").value=""; }
};

// ---------- jobs
async function start(kind, args={}){
  try { const j = await api("/api/jobs",{kind,args}); selectJob(j.id); await loadJobs(); return j; }
  catch(e){ toast(e.message); return null; }
}
async function loadJobs(){
  try { jobsCache = (await api("/api/jobs")).jobs; } catch(e){ return; }
  const box=$("jobs"); box.innerHTML="";
  renderAll();
  if(!jobsCache.length) box.append(el("div",{class:"empty"},"还没有操作。"));
  for(const j of jobsCache){
    const t=new Date(j.started*1000).toLocaleTimeString();
    box.append(el("div",{class:"job"+(j.id===jobId?" on":""),onclick:()=>selectJob(j.id)},
      el("span",{class:"dot "+j.status}), el("span",{},`${j.label}${j.project?" · "+j.project:""}`),
      el("span",{class:"spacer"}), el("span",{class:"empty"},`${JOBST[j.status]} ${t}`)));
  }
}
function selectJob(id){ jobId=id; since=0; $("log").textContent=""; pollLog(); loadJobs(); }
async function pollLog(){
  if(!jobId) return;
  let j; try { j = await api(`/api/jobs/${jobId}?since=${since}`); } catch(e){ return; }
  const pre=$("log"), atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
  if(j.lines.length){ pre.textContent += j.lines.join("\n") + "\n"; if(atBottom) pre.scrollTop = pre.scrollHeight; }
  since = j.next;
  $("logTitle").textContent = `${j.label}${j.project?" · "+j.project:""} — ${JOBST[j.status]}${j.exit_code!=null&&j.status==="failed"?" (退出码 "+j.exit_code+")":""}`;
  $("stop").disabled = j.status!=="running";
  $("stop").onclick = async () => { if(confirm("停止这个操作？进行中的任务会在恢复后重新排队。")) { await api(`/api/jobs/${jobId}/stop`,{}); toast("正在停止…"); } };
  if(j.status!=="running" && !finishedSeen.has(j.id)){ finishedSeen.add(j.id); refresh(); }
}

// ---------- quit
$("quit").onclick = async () => {
  try { await api("/api/shutdown",{}); }
  catch(e){
    if(e.status===409){ if(!confirm(`还有 ${e.data.running} 个操作在进行，退出会停止它们。确定退出？`)) return;
      await api("/api/shutdown",{force:true}); }
    else { toast(e.message); return; }
  }
  document.body.innerHTML = "<div class='bye'><h2>AI Dev Team 已退出</h2><p>可以关闭这个标签页。下次双击 App 再打开。</p></div>";
};

refresh(); loadJobs();
setInterval(()=>{ refresh(); loadJobs(); }, 4000);
setInterval(()=>{ const j=jobsCache.find(x=>x.id===jobId); if(!j || j.status==="running") pollLog(); }, 1000);
</script>
</body>
